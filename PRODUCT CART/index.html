<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Product Cart - JAVASCRIPT PROJECT</title>
  </head>
  <body>
    <header class="header-container">
      <div class="product-name">
        <h2>Product Cart</h2>
      </div>

      <div class="product-list" id="display-sideBar">0 Items</div>
    </header>

    <section class="products-container">
      <div class="product-cards" data-id="0">
        <div class="image-section">
          <img src="./image/Product-Image-1.jpg" alt="Product-1" />
        </div>
        <div class="price-section">
          <span class="product-name">Chicken Roast</span>
          <span class="product-price">₹50.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="1">
        <div class="image-section">
          <img src="./image/Product-Image-2.jpg" alt="Product-2" />
        </div>
        <div class="price-section">
          <span class="product-name">Veg Roast</span>
          <span class="product-price">₹45.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="2">
        <div class="image-section">
          <img src="./image/Product-Image-3.jpg" alt="Product-3" />
        </div>
        <div class="price-section">
          <span class="product-name">Veg Soup</span>
          <span class="product-price">₹35.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="3">
        <div class="image-section">
          <img src="./image/Product-Image-4.jpg" alt="Product-4" />
        </div>
        <div class="price-section">
          <span class="product-name">Pasta</span>
          <span class="product-price">₹20.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="4">
        <div class="image-section">
          <img src="./image/Product-Image-2.jpg" alt="Product-5" />
        </div>
        <div class="price-section">
          <span class="product-name">Veg Noddles</span>
          <span class="product-price">₹25.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="5">
        <div class="image-section">
          <img src="./image/Product-Image-3.jpg" alt="Product-6" />
        </div>
        <div class="price-section">
          <span class="product-name">Sharwarma</span>
          <span class="product-price">₹20.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="6">
        <div class="image-section">
          <img src="./image/Product-Image-7.jpg" alt="Product-7" />
        </div>
        <div class="price-section">
          <span class="product-name">Chicken Fry</span>
          <span class="product-price">₹30.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>

      <div class="product-cards" data-id="7">
        <div class="image-section">
          <img src="./image/Product-Image-8.jpg" alt="Product-8" />
        </div>
        <div class="price-section">
          <span class="product-name">Shushi Fish</span>
          <span class="product-price">₹40.00</span>
        </div>
        <div class="product-btn">
          <button class="add-btn">Add To Cart</button>
        </div>
      </div>
    </section>

    <section class="sidepanel-product">
      <div class="sidebar-heading">
        <h2>Product Price</h2>
        <button class="close-btn" id="close-btn">X</button>
      </div>

      <div class="sidepanel-container">
      </div>

      <div class="sidebar-total-price">
        <h3>Total</h3>
        <h3 id="total-price">$0.00</h3>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
